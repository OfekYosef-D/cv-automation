# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - main
  path_instructions:
    - path: "apps/api/**"
      instructions: "This is a NestJS API. Focus on proper dependency injection, guard usage, and Prisma patterns."
    - path: "apps/web/**"
      instructions: "This is a Next.js 14 app with App Router. Check for proper Server/Client component boundaries and React patterns."
    - path: "packages/**"
      instructions: "These are shared packages. Ensure proper exports and type definitions."
chat:
  auto_reply: true
